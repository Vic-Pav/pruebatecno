# ============================================================================
# NOTAS DE CONFIGURACIÓN
# ============================================================================
#
# 1. MÚLTIPLES MÓDULOS POR DISPOSITIVO:
#    Si necesitas aplicar múltiples módulos SNMP al mismo dispositivo,
#    crea jobs separados con diferentes params:
#
#    - job_name: 'device-interfaces'
#      params: {module: [if_mib]}
#      static_configs: [{targets: [192.168.1.1]}]
#    
#    - job_name: 'device-cisco'
#      params: {module: [cisco_system]}
#      static_configs: [{targets: [192.168.1.1]}]
#
# 2. SCRAPE INTERVALS:
#    - Interfaces: 30s (red cambia frecuentemente)
#    - CPU/Memory: 60s (menos crítico)
#    - Temperature: 120s (cambia lentamente)
#
# 3. TIMEOUT:
#    - Ajustar según red y número de OIDs
#    - Dispositivos lentos: aumentar a 20-30s
#    - Red rápida: 5-10s suficiente
#
# 4. LABELS:
#    Usar labels para organizar y filtrar:
#    - vendor: cisco, hp, juniper, etc.
#    - device_type: router, switch, firewall
#    - site: datacenter-1, office-ny, etc.
#    - environment: production, staging, dev
#    - criticality: critical, high, medium, low
#
# 5. RELABEL CONFIGS AVANZADOS:
#    
#    # Agregar hostname desde label existente
#    - source_labels: [__address__]
#      target_label: hostname
#      regex: '(\d+\.\d+\.\d+\.\d+)'
#      replacement: 'device-$1'
#    
#    # Filtrar métricas por expresión regular
#    - source_labels: [__name__]
#      regex: 'snmp_(interface|cisco)_.*'
#      action: keep
#    
#    # Renombrar labels
#    - source_labels: [ifDescr]
#      target_label: interface
#      regex: '(.*)'
#      replacement: '$1'
#
# 6. SEGURIDAD:
#    - No exponer Prometheus directamente a internet
#    - Usar autenticación (OAuth, basic auth)
#    - Limitar acceso con nginx reverse proxy
#    - Usar HTTPS en producción
#
# 7. RECARGAR CONFIGURACIÓN:
#    curl -X POST http://localhost:9090/prometheus/-/reload
#    (requiere --web.enable-lifecycle en comando de inicio)
#
# 8. VALIDAR CONFIGURACIÓN:
#    docker exec prometheus promtool check config /etc/prometheus/prometheus.yml
#
# ============================================================================
