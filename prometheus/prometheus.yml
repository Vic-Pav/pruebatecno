global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/rules/alerts.yml"

scrape_configs:
  - job_name: "django"
    metrics_path: /metrics/influx/
    scrape_interval: 15s
    static_configs:
      - targets: ["web:8000"]

  - job_name: "system_metrics"
    static_configs:
      - targets: ["system_metrics_exporter:9153"]
  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
